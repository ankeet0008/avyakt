<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pirates of the Caribbean - Coming Soon</title>
  <meta name="description" content="Hoist the colours! The voyage begins soon. Official countdown and maiden voyage reveal." />

  <!-- Google Fonts: Pirate display & serif fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Pirata+One&display=swap" rel="stylesheet" />

  <!-- GSAP 3.13+ and Plugins from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MorphSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/DrawSVGPlugin.min.js"></script>

  <style>
    :root {
      --color-black: #000000;
      --color-gold: #c9a227;
      --color-gold-light: #ffd768;
      --color-gold-dark: #846513;
      --color-sea-deep: #0a1a2f;
      --color-sea-midnight: #040c17;
      --font-pirate: 'Pirata One', 'Cinzel Decorative', Georgia, serif;
      --font-cinzel: 'Cinzel Decorative', 'Cinzel', serif;
      --font-serif: 'Cinzel', Georgia, serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-black);
      color: var(--color-gold);
      font-family: var(--font-cinzel);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .pirates-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--color-black);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* CURTAIN SPLIT (Phase 4) */
    .curtain-split-wrapper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.5%;
      background: radial-gradient(circle at center, #070707 0%, #000000 100%);
      will-change: transform;
    }

    .curtain-panel-left {
      left: 0;
      border-right: 1px solid rgba(201, 162, 39, 0.15);
    }

    .curtain-panel-right {
      right: 0;
      border-left: 1px solid rgba(201, 162, 39, 0.15);
    }

    .curtain-seam-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-50%) scaleY(0);
      background: linear-gradient(180deg, transparent 0%, #ffd768 25%, #c9a227 50%, #ffd768 75%, transparent 100%);
      box-shadow: 0 0 15px var(--color-gold-light), 0 0 35px var(--color-gold);
      z-index: 25;
      transform-origin: center;
      opacity: 0;
    }

    /* LOGO LOCKUP (Phases 1-3) */
    .coming-soon-lockup {
      position: absolute;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      will-change: transform, opacity;
      transform-origin: center center;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 850px;
    }

    .lockup-inner {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 32px);
      width: 100%;
    }

    .coming-title {
      font-family: var(--font-pirate);
      font-size: clamp(3.2rem, 8.5vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: var(--color-gold);
      text-shadow: 
        0 0 15px rgba(201, 162, 39, 0.5),
        0 0 35px rgba(201, 162, 39, 0.25),
        2px 2px 4px rgba(0, 0, 0, 0.9);
      line-height: 1;
      text-transform: uppercase;
    }

    .soon-svg-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(130px, 28vw, 300px);
      height: clamp(65px, 14vw, 150px);
    }

    .soon-morph-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 18px rgba(201, 162, 39, 0.45));
    }

    .soon-morph-path {
      transform-origin: center center;
    }

    .lockup-subtitle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      font-family: var(--font-serif);
      font-size: clamp(0.7rem, 1.4vw, 1.05rem);
      letter-spacing: 0.35em;
      color: rgba(255, 215, 104, 0.85);
      text-shadow: 0 0 10px rgba(201, 162, 39, 0.3);
      text-align: center;
    }

    .lockup-subtitle .flourish {
      color: var(--color-gold);
      font-size: 0.9em;
    }

    /* OCEAN SCENE (Phase 5) */
    .ocean-scene-wrapper {
      position: absolute;
      inset: 0;
      z-index: 10;
      background-color: var(--color-sea-midnight);
      overflow: hidden;
    }

    .storm-sky {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70%;
      background: radial-gradient(ellipse at 50% 25%, #10233b 0%, #06111f 55%, #02060c 100%);
      overflow: hidden;
    }

    .sky-moon-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(201, 222, 255, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .cloud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 250%;
      height: 100%;
      opacity: 0.45;
      pointer-events: none;
    }

    .cloud-layer-back {
      background: radial-gradient(ellipse at 30% 20%, rgba(20, 36, 56, 0.7) 0%, transparent 60%),
                  radial-gradient(ellipse at 75% 35%, rgba(15, 28, 45, 0.8) 0%, transparent 65%);
      animation: driftClouds 45s linear infinite;
    }

    .cloud-layer-mid {
      background: radial-gradient(ellipse at 50% 15%, rgba(12, 24, 38, 0.8) 0%, transparent 55%),
                  radial-gradient(ellipse at 85% 25%, rgba(25, 45, 70, 0.6) 0%, transparent 60%);
      animation: driftClouds 32s linear infinite reverse;
      opacity: 0.55;
    }

    .cloud-layer-front {
      background: radial-gradient(ellipse at 20% 30%, rgba(8, 16, 26, 0.85) 0%, transparent 50%),
                  radial-gradient(ellipse at 65% 15%, rgba(10, 20, 32, 0.9) 0%, transparent 60%);
      animation: driftClouds 22s linear infinite;
      opacity: 0.7;
    }

    @keyframes driftClouds {
      from { transform: translateX(0); }
      to { transform: translateX(-35%); }
    }

    .rain-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
    }

    .lightning-flash-overlay {
      position: absolute;
      inset: 0;
      background-color: #f4f8ff;
      opacity: 0;
      pointer-events: none;
      z-index: 18;
      mix-blend-mode: screen;
    }

    .lightning-bolt-wrapper {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 55vh;
      pointer-events: none;
      z-index: 15;
    }

    .lightning-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px #c9e2ff) drop-shadow(0 0 35px #79b3ff);
    }

    .ship-wrapper {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(240px, 36vw, 420px);
      height: auto;
      z-index: 13;
      pointer-events: none;
    }

    .pirate-ship-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9));
    }

    .waves-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38%;
      overflow: hidden;
      z-index: 14;
    }

    .wave-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      pointer-events: none;
    }

    .wave-layer-1 { bottom: 12%; opacity: 0.5; }
    .wave-layer-2 { bottom: 8%; opacity: 0.7; }
    .wave-layer-3 { bottom: 4%; opacity: 0.85; }
    .wave-layer-4 { bottom: 0%; opacity: 0.95; }

    .svg-wave-track {
      display: flex;
      width: 200%;
      height: 100%;
      will-change: transform;
    }

    .wave-svg {
      width: 50%;
      height: 100%;
    }

    .ocean-abyss-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45px;
      background: linear-gradient(180deg, transparent 0%, #030811 100%);
      z-index: 15;
    }

    /* COUNTDOWN (Phase 6) */
    .countdown-section-container {
      position: absolute;
      bottom: clamp(18px, 4.5vh, 45px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 92%;
      max-width: 680px;
    }

    .countdown-title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: clamp(0.68rem, 1.2vw, 0.9rem);
      letter-spacing: 0.28em;
      color: var(--color-gold-light);
      opacity: 0.9;
      text-shadow: 0 0 10px rgba(201, 162, 39, 0.4);
    }

    .compass-icon {
      color: var(--color-gold);
      font-size: 0.85em;
    }

    .countdown-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.6vw, 18px);
    }

    .countdown-card {
      position: relative;
      background: linear-gradient(145deg, rgba(28, 22, 14, 0.94) 0%, rgba(12, 10, 7, 0.97) 100%);
      border: 1.5px solid var(--color-gold-dark);
      box-shadow: 
        inset 0 0 18px rgba(0, 0, 0, 0.9),
        0 10px 25px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(201, 162, 39, 0.18);
      border-radius: 4px;
      padding: clamp(8px, 1.8vw, 16px) clamp(10px, 2.4vw, 24px);
      min-width: clamp(62px, 14vw, 110px);
      text-align: center;
      backdrop-filter: blur(6px);
      perspective: 600px;
    }

    .card-rivet {
      position: absolute;
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, #ffe18b 20%, #7c5c16 90%);
      border-radius: 50%;
    }

    .rivet-tl { top: 4px; left: 4px; }
    .rivet-tr { top: 4px; right: 4px; }
    .rivet-bl { bottom: 4px; left: 4px; }
    .rivet-br { bottom: 4px; right: 4px; }

    .card-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-digit {
      font-family: var(--font-cinzel);
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      font-weight: 900;
      color: var(--color-gold-light);
      text-shadow: 
        0 0 12px rgba(255, 215, 104, 0.65),
        0 2px 4px rgba(0, 0, 0, 0.95);
      line-height: 1.1;
      will-change: transform, opacity;
    }

    .card-label {
      font-family: var(--font-serif);
      font-size: clamp(0.55rem, 1vw, 0.72rem);
      letter-spacing: 0.22em;
      color: var(--color-gold);
      opacity: 0.8;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .countdown-separator {
      font-family: var(--font-cinzel);
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      color: var(--color-gold);
      opacity: 0.6;
      text-shadow: 0 0 10px rgba(201, 162, 39, 0.4);
    }

    /* CONTROLS */
    .fixed-sound-toggle {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 50;
    }

    .sound-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(12, 12, 12, 0.7);
      border: 1px solid var(--color-gold-dark);
      border-radius: 30px;
      color: var(--color-gold);
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .sound-toggle-btn:hover {
      border-color: var(--color-gold-light);
      box-shadow: 0 0 15px rgba(201, 162, 39, 0.35);
      transform: translateY(-1px);
    }

    .sound-text {
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      font-weight: 700;
    }

    .fixed-skip-wrap {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 50;
    }

    .skip-intro-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(15, 12, 8, 0.75);
      border: 1px solid var(--color-gold-dark);
      border-radius: 4px;
      color: var(--color-gold-light);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      transition: opacity 0.4s ease, transform 0.3s ease;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .skip-intro-btn:hover {
      border-color: var(--color-gold-light);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(201, 162, 39, 0.4);
    }

    .skip-intro-btn.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .skip-border-deco {
      color: var(--color-gold);
      font-size: 0.7em;
    }

    @media (max-width: 600px) {
      .lockup-inner { flex-direction: column; gap: 8px; }
      .soon-svg-container { width: 170px; height: 80px; }
      .ship-wrapper { bottom: 33%; width: 200px; }
      .countdown-section-container { bottom: 20px; }
      .countdown-card { min-width: 58px; padding: 6px 8px; }
      .fixed-sound-toggle { top: 14px; right: 14px; }
      .fixed-skip-wrap { bottom: 14px; right: 14px; }
    }
  </style>
</head>
<body>
  <div class="pirates-viewport">
    <!-- Sound Toggle -->
    <div class="fixed-sound-toggle">
      <button id="soundToggleBtn" class="sound-toggle-btn" aria-label="Toggle sound">
        <span id="soundIcon" class="sound-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#c9a227" opacity="0.4" />
            <line x1="23" y1="9" x2="17" y2="15" stroke="#e64c4c" strokeWidth="2.5" />
            <line x1="17" y1="9" x2="23" y2="15" stroke="#e64c4c" strokeWidth="2.5" />
          </svg>
        </span>
        <span id="soundText" class="sound-text">SOUND OFF</span>
      </button>
    </div>

    <!-- Skip Button -->
    <div class="fixed-skip-wrap">
      <button id="skipIntroBtn" class="skip-intro-btn">
        <span class="skip-border-deco">❖</span>
        <span class="skip-label">SKIP INTRO</span>
        <span class="skip-border-deco">❖</span>
      </button>
    </div>

    <!-- Background Ocean Scene -->
    <div id="oceanSceneWrapper" class="ocean-scene-wrapper">
      <div class="storm-sky">
        <div class="cloud-layer cloud-layer-back"></div>
        <div class="cloud-layer cloud-layer-mid"></div>
        <div class="cloud-layer cloud-layer-front"></div>
        <div class="sky-moon-glow"></div>
      </div>

      <canvas id="rainCanvas" class="rain-canvas"></canvas>
      <div id="lightningFlash" class="lightning-flash-overlay"></div>

      <div id="lightningBoltWrap" class="lightning-bolt-wrapper">
        <svg class="lightning-svg" viewBox="0 0 500 500" preserveAspectRatio="none">
          <path id="lightningPath" fill="none" stroke="#f4f8ff" stroke-width="3.5" stroke-linecap="round" style="opacity: 0;" />
        </svg>
      </div>

      <div class="ship-wrapper">
        <svg id="pirateShipSvg" class="pirate-ship-svg" viewBox="0 0 400 320">
          <g class="ship-silhouette" fill="#030811" stroke="#c9a227" stroke-width="0.8">
            <path d="M 60,230 C 90,265 290,265 330,225 C 345,210 350,195 345,185 L 315,185 C 310,195 295,200 280,200 L 110,200 C 90,200 75,190 65,180 L 40,180 C 45,198 52,215 60,230 Z" />
            <path d="M 285,200 L 320,185 L 325,145 L 290,152 L 285,200 Z" />
            <circle cx="330" cy="140" r="4" fill="#ffd768" opacity="0.8" />
            <path d="M 65,182 L 8,150 L 10,156 L 68,190 Z" />
            <line x1="120" y1="195" x2="120" y2="55" stroke="#030811" stroke-width="4.5" />
            <path d="M 95,165 Q 120,172 145,165 L 140,135 Q 120,140 100,135 Z" fill="#08101a" />
            <path d="M 100,125 Q 120,131 140,125 L 138,95 Q 120,100 102,95 Z" fill="#091421" />
            <path d="M 105,88 Q 120,93 135,88 L 132,65 Q 120,70 108,65 Z" fill="#0b1828" />
            <line x1="200" y1="195" x2="200" y2="25" stroke="#030811" stroke-width="5.5" />
            <path d="M 168,162 Q 200,170 232,162 L 226,128 Q 200,134 174,128 Z" fill="#08101a" />
            <path d="M 172,120 Q 200,127 228,120 L 224,85 Q 200,92 176,85 Z" fill="#091421" />
            <path d="M 178,78 Q 200,84 222,78 L 218,50 Q 200,55 182,50 Z" fill="#0b1828" />
            <rect x="193" y="46" width="14" height="6" fill="#030811" />
            <path id="shipFlag" d="M 200,26 Q 215,22 230,28 L 225,42 Q 212,38 200,40 Z" fill="#c9a227" />
            <line x1="270" y1="195" x2="270" y2="65" stroke="#030811" stroke-width="4" />
            <path d="M 248,155 Q 270,161 292,155 L 288,125 Q 270,130 252,125 Z" fill="#08101a" />
            <path d="M 252,118 Q 270,124 288,118 L 285,90 Q 270,95 255,90 Z" fill="#091421" />
            <polygon points="65,180 15,152 118,100" fill="#081320" opacity="0.85" />
            <line x1="120" y1="55" x2="80" y2="195" stroke="#07111c" stroke-width="1.2" opacity="0.6" />
            <line x1="120" y1="55" x2="150" y2="195" stroke="#07111c" stroke-width="1.2" opacity="0.6" />
            <line x1="200" y1="25" x2="155" y2="195" stroke="#07111c" stroke-width="1.4" opacity="0.6" />
            <line x1="200" y1="25" x2="245" y2="195" stroke="#07111c" stroke-width="1.4" opacity="0.6" />
            <line x1="270" y1="65" x2="235" y2="195" stroke="#07111c" stroke-width="1.2" opacity="0.6" />
            <line x1="270" y1="65" x2="305" y2="195" stroke="#07111c" stroke-width="1.2" opacity="0.6" />
          </g>
        </svg>
      </div>

      <div id="wavesContainer" class="waves-container">
        <!-- 4 Layered waves -->
        <div class="wave-layer wave-layer-1">
          <div class="svg-wave-track">
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#05101d" d="M 0,90 Q 250,40 500,90 T 1000,90 T 1500,90 T 2000,90 L 2000,300 L 0,300 Z"/></svg>
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#05101d" d="M 0,90 Q 250,40 500,90 T 1000,90 T 1500,90 T 2000,90 L 2000,300 L 0,300 Z"/></svg>
          </div>
        </div>
        <div class="wave-layer wave-layer-2">
          <div class="svg-wave-track">
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#08182b" d="M 0,110 C 200,60 350,150 550,110 C 750,70 900,140 1100,110 C 1300,75 1450,150 1650,110 C 1850,70 1950,130 2000,110 L 2000,300 L 0,300 Z"/></svg>
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#08182b" d="M 0,110 C 200,60 350,150 550,110 C 750,70 900,140 1100,110 C 1300,75 1450,150 1650,110 C 1850,70 1950,130 2000,110 L 2000,300 L 0,300 Z"/></svg>
          </div>
        </div>
        <div class="wave-layer wave-layer-3">
          <div class="svg-wave-track">
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#0a1d33" d="M 0,135 Q 180,85 360,135 T 720,135 T 1080,135 T 1440,135 T 1800,135 T 2000,135 L 2000,300 L 0,300 Z"/></svg>
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#0a1d33" d="M 0,135 Q 180,85 360,135 T 720,135 T 1080,135 T 1440,135 T 1800,135 T 2000,135 L 2000,300 L 0,300 Z"/></svg>
          </div>
        </div>
        <div class="wave-layer wave-layer-4">
          <div class="svg-wave-track">
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#071728" d="M 0,165 C 150,120 280,190 450,165 C 620,135 760,195 950,165 C 1140,135 1280,195 1450,165 C 1620,135 1780,195 2000,165 L 2000,300 L 0,300 Z"/></svg>
            <svg class="wave-svg" viewBox="0 0 2000 300" preserveAspectRatio="none"><path fill="#071728" d="M 0,165 C 150,120 280,190 450,165 C 620,135 760,195 950,165 C 1140,135 1280,195 1450,165 C 1620,135 1780,195 2000,165 L 2000,300 L 0,300 Z"/></svg>
          </div>
        </div>
        <div class="ocean-abyss-gradient"></div>
      </div>
    </div>

    <!-- Foreground Split Curtains -->
    <div class="curtain-split-wrapper">
      <div id="curtainLeft" class="curtain-panel curtain-panel-left"></div>
      <div id="curtainRight" class="curtain-panel curtain-panel-right"></div>
      <div id="curtainSeam" class="curtain-seam-line"></div>
    </div>

    <!-- Header Lockup: COMING SOON -->
    <div id="lockup" class="coming-soon-lockup">
      <div class="lockup-inner">
        <h1 id="comingWord" class="coming-title">COMING</h1>
        <div class="soon-svg-container">
          <svg id="soonSvg" class="soon-morph-svg" viewBox="0 0 500 240" preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3.5" result="glow" />
                <feComposite in="SourceGraphic" in2="glow" operator="over" />
              </filter>
              <linearGradient id="pirateGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffd768" />
                <stop offset="45%" stop-color="#c9a227" />
                <stop offset="80%" stop-color="#967215" />
                <stop offset="100%" stop-color="#e5bf45" />
              </linearGradient>
            </defs>
            <path id="soonMorphPath" class="soon-morph-path" fill="url(#pirateGoldGrad)" stroke="#ffd768" stroke-width="1.2" filter="url(#goldGlow)" />
          </svg>
        </div>
      </div>
      <div class="lockup-subtitle">
        <span class="flourish">⚓</span>
        <span class="subtitle-text">HOIST THE COLOURS &bull; PREPARE FOR VOYAGE</span>
        <span class="flourish">⚓</span>
      </div>
    </div>

    <!-- Countdown Section -->
    <div id="countdownSection" class="countdown-section-container">
      <div class="countdown-title-bar">
        <span class="compass-icon">✦</span>
        <span class="voyage-date-label">SCHEDULED MAIDEN VOYAGE</span>
        <span class="compass-icon">✦</span>
      </div>
      <div class="countdown-grid">
        <div class="countdown-card">
          <div class="card-rivet rivet-tl"></div><div class="card-rivet rivet-tr"></div>
          <div class="card-rivet rivet-bl"></div><div class="card-rivet rivet-br"></div>
          <div class="card-inner">
            <div id="daysDigit" class="card-digit">00</div>
            <div class="card-label">DAYS</div>
          </div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-card">
          <div class="card-rivet rivet-tl"></div><div class="card-rivet rivet-tr"></div>
          <div class="card-rivet rivet-bl"></div><div class="card-rivet rivet-br"></div>
          <div class="card-inner">
            <div id="hoursDigit" class="card-digit">00</div>
            <div class="card-label">HOURS</div>
          </div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-card">
          <div class="card-rivet rivet-tl"></div><div class="card-rivet rivet-tr"></div>
          <div class="card-rivet rivet-bl"></div><div class="card-rivet rivet-br"></div>
          <div class="card-inner">
            <div id="minsDigit" class="card-digit">00</div>
            <div class="card-label">MINUTES</div>
          </div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-card">
          <div class="card-rivet rivet-tl"></div><div class="card-rivet rivet-tr"></div>
          <div class="card-rivet rivet-bl"></div><div class="card-rivet rivet-br"></div>
          <div class="card-inner">
            <div id="secsDigit" class="card-digit">00</div>
            <div class="card-label">SECONDS</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * TARGET LAUNCH DATE - SINGLE EDITABLE CONSTANT
     */
    const LAUNCH_DATE = new Date("2026-12-01T00:00:00");

    // Register GSAP plugins
    if (typeof gsap !== 'undefined') {
      if (typeof MorphSVGPlugin !== 'undefined') gsap.registerPlugin(MorphSVGPlugin);
      if (typeof DrawSVGPlugin !== 'undefined') gsap.registerPlugin(DrawSVGPlugin);
    }

    // High quality matching SVG morph paths (0 0 500 240)
    const MORPH_PATHS = {
      // SOON crafted in Pirata One authentic gothic pirate lettering (matching "COMING")
      soon: "M 68,52 C 60,52 50,56 42,65 L 42,42 L 28,48 L 28,105 C 40,94 54,88 66,88 C 76,88 84,93 84,103 C 84,115 72,126 56,138 C 38,152 26,168 26,192 C 26,218 48,235 78,235 C 92,235 106,228 116,218 L 116,240 L 130,234 L 130,172 C 116,186 100,195 84,195 C 70,195 60,188 60,176 C 60,162 74,150 92,136 C 112,120 124,102 124,78 C 124,52 102,52 68,52 Z M 188,48 C 150,48 132,85 132,142 C 132,200 150,235 188,235 C 226,235 244,200 244,142 C 244,85 226,48 188,48 Z M 188,72 C 205,72 214,100 214,142 C 214,185 205,212 188,212 C 171,212 162,185 162,142 C 162,100 171,72 188,72 Z M 298,48 C 260,48 242,85 242,142 C 242,200 260,235 298,235 C 336,235 354,200 354,142 C 354,85 336,48 298,48 Z M 298,72 C 315,72 324,100 324,142 C 324,185 315,212 298,212 C 281,212 272,185 272,142 C 272,100 281,72 298,72 Z M 368,232 L 395,232 L 395,125 L 448,232 L 476,232 L 476,52 L 450,52 L 450,158 L 396,52 L 368,52 Z",

      // Realistic Pirate Skull with crossbones, eye sockets, nasal cavity & teeth
      skull: "M 250,20 C 190,20 155,58 155,108 C 155,135 168,155 182,172 L 180,210 C 180,222 192,230 205,230 L 295,230 C 308,230 320,222 320,210 L 318,172 C 332,155 345,135 345,108 C 345,58 310,20 250,20 Z M 205,105 C 220,105 228,122 220,138 C 214,152 196,152 190,138 C 182,122 192,105 205,105 Z M 295,105 C 308,105 318,122 310,138 C 304,152 286,152 280,138 C 272,122 282,105 295,105 Z M 245,150 L 255,150 L 260,172 L 250,176 L 240,172 Z M 208,195 L 222,195 L 222,216 L 208,216 Z M 230,195 L 244,195 L 244,216 L 230,216 Z M 256,195 L 270,195 L 270,216 L 256,216 Z M 278,195 L 292,195 L 292,216 L 278,216 Z M 105,45 C 95,35 80,45 88,58 L 145,115 L 88,172 C 80,185 95,195 105,185 L 140,150 L 140,120 Z M 395,45 C 405,35 420,45 412,58 L 355,115 L 412,172 C 420,185 405,195 395,185 L 360,150 L 360,120 Z",

      // Authentic 18th-century Pirate Flintlock Pistol (flared muzzle, frizzen, hammer, curled trigger guard, curved grip)
      pistol: "M 42,108 L 220,108 L 220,95 L 255,75 C 265,68 280,72 278,85 L 272,100 L 290,95 C 300,92 310,98 308,110 L 295,120 L 330,120 C 342,120 350,126 348,138 C 345,150 335,154 322,154 L 270,154 L 285,178 C 295,195 285,225 265,232 C 245,238 230,225 235,205 L 248,168 L 210,160 L 195,188 C 185,198 165,198 160,182 L 175,155 L 115,155 L 90,170 L 42,155 L 42,142 L 180,142 L 180,132 L 42,132 Z M 42,108 L 42,98 L 30,98 L 30,142 L 42,142 Z M 175,162 C 188,162 195,172 190,182 C 185,190 172,190 168,180 Z M 245,115 L 265,115 L 260,135 L 242,135 Z",

      // Realistic Pirate Treasure Chest (domed lid, iron strap bands, rivets, keyhole escutcheon plate, side handles, doubloons)
      chest: "M 90,85 C 90,52 155,30 250,30 C 345,30 410,52 410,85 L 425,128 L 415,220 C 415,232 402,238 385,238 L 115,238 C 98,238 85,232 85,220 L 75,128 Z M 92,124 L 408,124 L 402,90 C 385,62 330,48 250,48 C 170,48 115,62 98,90 Z M 145,44 L 175,44 L 175,235 L 145,235 Z M 325,44 L 355,44 L 355,235 L 325,235 Z M 225,112 L 275,112 L 278,168 L 250,185 L 222,168 Z M 245,135 C 245,128 255,128 255,135 L 257,152 L 243,152 Z M 60,145 C 50,145 50,175 60,175 L 75,175 L 75,145 Z M 440,145 C 450,145 450,175 440,175 L 425,175 L 425,145 Z M 185,120 C 190,110 205,110 210,120 C 215,112 230,112 235,122 L 185,122 Z M 265,120 C 270,110 285,110 290,120 C 295,112 310,112 315,122 L 265,122 Z"
    };

    const LIGHTNING_PATHS = [
      "M 280,0 L 270,60 L 310,130 L 290,140 L 330,220 L 305,235 L 340,330 L 315,350 L 335,460 M 310,130 L 360,180 L 345,190 L 375,250 M 330,220 L 270,270 L 285,285 L 260,340",
      "M 350,0 L 340,70 L 315,120 L 330,130 L 295,210 L 315,225 L 280,310 L 300,330 L 270,450 M 315,120 L 260,175 L 275,190 L 240,240 M 295,210 L 350,260 L 340,275 L 370,330",
      "M 200,0 L 215,80 L 180,140 L 205,155 L 170,240 L 190,260 L 160,350 L 185,370 L 150,470 M 180,140 L 235,190 L 220,205 L 250,270 M 170,240 L 125,290 L 138,305 L 110,360"
    ];

    // Set initial SOON path
    document.getElementById('soonMorphPath').setAttribute('d', MORPH_PATHS.soon);

    // ========================================================
    // PROCEDURAL AUDIO SYNTHESIZER
    // ========================================================
    let audioCtx = null;
    let isMuted = true;
    let ambientGain = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const text = document.getElementById('soundText');
      const icon = document.getElementById('soundIcon');
      if (!isMuted) {
        initAudio();
        startAmbientSound();
        text.textContent = 'SOUND ON';
        icon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#c9a227"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="#ffd768"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="#ffd768"/></svg>`;
      } else {
        if (ambientGain && audioCtx) {
          ambientGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
        }
        text.textContent = 'SOUND OFF';
        icon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#c9a227" opacity="0.4"/><line x1="23" y1="9" x2="17" y2="15" stroke="#e64c4c" stroke-width="2.5"/><line x1="17" y1="9" x2="23" y2="15" stroke="#e64c4c" stroke-width="2.5"/></svg>`;
      }
    }

    function startAmbientSound() {
      if (!audioCtx || isMuted) return;
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 3, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < data.length; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (lastOut + 0.02 * white) / 1.02;
        lastOut = data[i];
        data[i] *= 2.5;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      noise.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(650, audioCtx.currentTime);
      ambientGain = audioCtx.createGain();
      ambientGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      ambientGain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.5);
      noise.connect(filter);
      filter.connect(ambientGain);
      ambientGain.connect(audioCtx.destination);
      noise.start();
    }

    function playThunderBoom() {
      if (isMuted || !audioCtx) return;
      initAudio();
      const now = audioCtx.currentTime;
      // Sub-bass rumble
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(75, now);
      osc.frequency.exponentialRampToValueAtTime(24, now + 1.8);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 2.3);
    }

    document.getElementById('soundToggleBtn').addEventListener('click', toggleSound);

    // ========================================================
    // RAIN CANVAS
    // ========================================================
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const drops = [];
    const dropCount = Math.min(180, Math.floor(width / 7));
    for (let i = 0; i < dropCount; i++) {
      drops.push({
        x: Math.random() * width,
        y: Math.random() * height,
        l: 18 + Math.random() * 26,
        v: 12 + Math.random() * 16,
      });
    }

    function renderRain() {
      ctx.clearRect(0, 0, width, height);
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(195, 220, 255, 0.35)';
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 3, d.y + d.l);
        ctx.stroke();
        d.y += d.v;
        d.x -= 1.5;
        if (d.y > height) {
          d.y = -d.l;
          d.x = Math.random() * (width + 50);
        }
      }
      requestAnimationFrame(renderRain);
    }
    renderRain();

    // ========================================================
    // LIGHTNING TRIGGER
    // ========================================================
    function strikeLightning() {
      const flash = document.getElementById('lightningFlash');
      const bolt = document.getElementById('lightningPath');
      const ship = document.getElementById('pirateShipSvg');
      const boltWrap = document.getElementById('lightningBoltWrap');
      if (!bolt || !flash) return;

      const randomIdx = Math.floor(Math.random() * LIGHTNING_PATHS.length);
      bolt.setAttribute('d', LIGHTNING_PATHS[randomIdx]);
      boltWrap.style.left = (15 + Math.random() * 70) + '%';

      playThunderBoom();

      const tl = gsap.timeline();
      tl.set(bolt, { opacity: 1, drawSVG: '0% 0%' })
        .to(bolt, { drawSVG: '0% 100%', duration: 0.12, ease: 'power2.in' })
        .to(flash, { opacity: 0.85, duration: 0.05, ease: 'none' }, 0)
        .to(flash, { opacity: 0.2, duration: 0.04, ease: 'none' }, '+=0.03')
        .to(flash, { opacity: 0.9, duration: 0.05, ease: 'none' })
        .to(flash, { opacity: 0, duration: 0.35, ease: 'power2.out' })
        .to(bolt, { opacity: 0, duration: 0.18, ease: 'power1.out' }, '-=0.3');

      if (ship) {
        gsap.fromTo(ship, 
          { filter: 'brightness(2.2) drop-shadow(0 0 15px rgba(244, 248, 255, 0.9))' },
          { filter: 'brightness(1) drop-shadow(0 0 0px rgba(0,0,0,0))', duration: 0.45, ease: 'power2.out' }
        );
      }
    }

    function scheduleLightning() {
      const delay = (3 + Math.random() * 4) * 1000;
      setTimeout(() => {
        strikeLightning();
        scheduleLightning();
      }, delay);
    }
    setTimeout(scheduleLightning, 3000);

    // Waves loop & Ship Rocking
    gsap.to('#pirateShipSvg', {
      rotation: 3.5,
      y: -12,
      duration: 3.2,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut',
      transformOrigin: '50% 85%'
    });

    document.querySelectorAll('.svg-wave-track').forEach((wave, idx) => {
      const speeds = [18, 13, 9, 6.5];
      gsap.to(wave, {
        xPercent: -50,
        duration: speeds[idx] || 10,
        repeat: -1,
        ease: 'none'
      });
      gsap.to(wave, {
        y: 8 + idx * 4,
        duration: 2.2 + idx * 0.7,
        repeat: -1,
        yoyo: true,
        ease: 'sine.inOut'
      });
    });

    // ========================================================
    // COUNTDOWN LOGIC
    // ========================================================
    function updateCountdown() {
      const total = LAUNCH_DATE.getTime() - Date.now();
      if (total <= 0) {
        document.getElementById('countdownSection').innerHTML = `
          <div style="text-align:center; padding:18px 32px; background:rgba(14,11,7,0.85); border:2px solid #c9a227; border-radius:6px; box-shadow:0 0 35px rgba(201,162,39,0.5);">
            <div style="font-size:1.8rem; color:#ffd768; margin-bottom:6px;">☠ ⚓ ☠</div>
            <h2 style="font-family:'Pirata One'; font-size:2.8rem; color:#ffd768; letter-spacing:0.15em;">WE HAVE LANDED</h2>
            <p style="font-family:'Cinzel'; font-size:0.85rem; letter-spacing:0.25em; color:#c9a227; margin-top:6px;">THE SHORES OF TREASURE HAVE BEEN REACHED</p>
          </div>
        `;
        return;
      }
      const s = Math.floor((total / 1000) % 60);
      const m = Math.floor((total / 1000 / 60) % 60);
      const h = Math.floor((total / (1000 * 60 * 60)) % 24);
      const d = Math.floor(total / (1000 * 60 * 60 * 24));

      const pad = n => String(n).padStart(2, '0');
      const dEl = document.getElementById('daysDigit');
      const hEl = document.getElementById('hoursDigit');
      const mEl = document.getElementById('minsDigit');
      const sEl = document.getElementById('secsDigit');

      if (sEl && sEl.textContent !== pad(s)) {
        sEl.textContent = pad(s);
        gsap.fromTo(sEl, { y: -25, opacity: 0.2, rotateX: -30 }, { y: 0, opacity: 1, rotateX: 0, duration: 0.45, ease: 'back.out(2)' });
      }
      if (mEl && mEl.textContent !== pad(m)) {
        mEl.textContent = pad(m);
        gsap.fromTo(mEl, { y: -25, opacity: 0.2, rotateX: -30 }, { y: 0, opacity: 1, rotateX: 0, duration: 0.45, ease: 'back.out(2)' });
      }
      if (hEl && hEl.textContent !== pad(h)) {
        hEl.textContent = pad(h);
        gsap.fromTo(hEl, { y: -25, opacity: 0.2, rotateX: -30 }, { y: 0, opacity: 1, rotateX: 0, duration: 0.45, ease: 'back.out(2)' });
      }
      if (dEl && dEl.textContent !== pad(d)) {
        dEl.textContent = pad(d);
        gsap.fromTo(dEl, { y: -25, opacity: 0.2, rotateX: -30 }, { y: 0, opacity: 1, rotateX: 0, duration: 0.45, ease: 'back.out(2)' });
      }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ========================================================
    // MASTER GSAP TIMELINE (Phases 1-6)
    // ========================================================
    function createIntroPhase() {
      const tl = gsap.timeline();
      gsap.set('#comingWord', { opacity: 0, scale: 0.95 });
      gsap.set('#soonSvg', { opacity: 0, scale: 0.95 });
      gsap.set('#curtainSeam', { opacity: 0, scaleY: 0 });

      tl.to('#comingWord', { opacity: 1, scale: 1, duration: 1.2, ease: 'power2.out' })
        .to('#soonSvg', { opacity: 1, scale: 1, duration: 0.9, ease: 'power2.out' }, '-=0.5');
      return tl;
    }

    function createMorphPhase() {
      const tl = gsap.timeline();
      const path = '#soonMorphPath';
      const svg = '#soonSvg';

      const bounce = () => gsap.fromTo(svg, { scale: 1.07 }, { scale: 1.0, duration: 0.22, ease: 'back.out(2.5)' });

      tl.to({}, { duration: 0.8 })
        .to(path, { morphSVG: { shape: MORPH_PATHS.skull, shapeIndex: 0, type: 'rotational' }, duration: 0.7, ease: 'power2.inOut', onComplete: bounce })
        .to({}, { duration: 0.8 })
        .to(path, { morphSVG: { shape: MORPH_PATHS.pistol, shapeIndex: 0, type: 'rotational' }, duration: 0.7, ease: 'power2.inOut', onComplete: bounce })
        .to({}, { duration: 0.8 })
        .to(path, { morphSVG: { shape: MORPH_PATHS.chest, shapeIndex: 0, type: 'rotational' }, duration: 0.7, ease: 'power2.inOut', onComplete: bounce })
        .to({}, { duration: 0.8 })
        .to(path, { morphSVG: { shape: MORPH_PATHS.soon, shapeIndex: 0, type: 'rotational' }, duration: 0.7, ease: 'power2.inOut', onComplete: bounce })
        .to({}, { duration: 0.4 });
      return tl;
    }

    function createLiftOffPhase() {
      const tl = gsap.timeline();
      tl.to('#lockup', { y: '-35vh', scale: 0.62, duration: 1.1, ease: 'power3.inOut' });
      return tl;
    }

    function createSplitPhase() {
      const tl = gsap.timeline();
      tl.to('#curtainSeam', { opacity: 1, scaleY: 1, duration: 0.45, ease: 'power2.out' })
        .to('#curtainSeam', { boxShadow: '0 0 25px #ffd768, 0 0 55px #c9a227', duration: 0.25 })
        .addLabel('doorsOpen')
        .to('#curtainLeft', { xPercent: -100, duration: 1.6, ease: 'power4.inOut' }, 'doorsOpen')
        .to('#curtainRight', { xPercent: 100, duration: 1.6, ease: 'power4.inOut' }, 'doorsOpen')
        .to('#curtainSeam', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 'doorsOpen')
        .to('#skipIntroBtn', { opacity: 0, pointerEvents: 'none', duration: 0.4 }, 'doorsOpen');
      return tl;
    }

    function createOceanPhase() {
      const tl = gsap.timeline();
      tl.fromTo('#oceanSceneWrapper', { opacity: 0.2, scale: 1.06 }, { opacity: 1, scale: 1.0, duration: 1.5, ease: 'power2.out' });
      return tl;
    }

    function createCountdownPhase() {
      const tl = gsap.timeline();
      tl.fromTo('#countdownSection', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.2, ease: 'power3.out' });
      return tl;
    }

    // Assemble Master Timeline
    const master = gsap.timeline({ id: 'master-pirates-timeline', defaults: { force3D: true } });
    master
      .add(createIntroPhase(), 'intro')
      .add(createMorphPhase(), 'morph')
      .add(createLiftOffPhase(), 'lift-off')
      .add(createSplitPhase(), 'split')
      .add(createOceanPhase(), 'split+=0.2')
      .add(createCountdownPhase(), 'split+=0.8');

    // Skip intro button click
    document.getElementById('skipIntroBtn').addEventListener('click', () => {
      master.progress(1);
      document.getElementById('skipIntroBtn').style.display = 'none';
    });

    // Prefers reduced motion check
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      master.progress(1);
      document.getElementById('skipIntroBtn').style.display = 'none';
    }
  </script>
